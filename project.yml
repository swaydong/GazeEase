name: EyeProtection

options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 39
    MARKETING_VERSION: 1.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 3Q9DKW2UKF
    ENABLE_HARDENED_RUNTIME: YES

targets:
  EyeProtection:
    type: application
    platform: macOS
    sources:
      - path: EyeProtection
        excludes:
          - Resources/Info.plist
          - Resources/EyeProtection.entitlements
    info:
      path: EyeProtection/Resources/Info.plist
      properties:
        CFBundleDisplayName: GazeEase
        CFBundleName: GazeEase
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSHasLocalizedDisplayName: true
        LSUIElement: true
    entitlements:
      path: EyeProtection/Resources/EyeProtection.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.EyeProtection
        PRODUCT_NAME: Eye Protection
        PRODUCT_MODULE_NAME: EyeProtection
        CODE_SIGN_ENTITLEMENTS: EyeProtection/Resources/EyeProtection.entitlements
        INFOPLIST_FILE: EyeProtection/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
  EyeProtectionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EyeProtectionTests
    dependencies:
      - target: EyeProtection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.EyeProtectionTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Eye Protection.app/Contents/MacOS/Eye Protection"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  EyeProtection:
    build:
      targets:
        EyeProtection: all
        EyeProtectionTests: [test]
    test:
      targets:
        - EyeProtectionTests
      environmentVariables:
        GAZEEASE_SCREENSHOT_DIR: "/tmp/GazeEaseVisualQA/RestOverlay"
        GAZEEASE_POPUP_SCREENSHOT_DIR: "/tmp/GazeEaseVisualQA/Reminders"
        GAZEEASE_MENU_SCREENSHOT_DIR: "/tmp/GazeEaseVisualQA/MenuPanel"
        GAZEEASE_DASHBOARD_SCREENSHOT_DIR: "/tmp/GazeEaseVisualQA/Analytics"
    run:
      config: Debug
    archive:
      config: Release
